<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>펌프·앰부백 제어</title>
<style>
:root{--bg:#f4f4f8;--card:#ffffff;--tx:#1b1b1f;--mu:#6b6b76;--ac:#5b3fd1;--acx:#ffffff;--ok:#1a8f4c;--dg:#d1242f;--bd:#dcdce6;--log:#101014;--logt:#c8f7d4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101014;--card:#1b1b22;--tx:#f1f1f5;--mu:#9a9aa8;--ac:#8d77f0;--acx:#12121a;--ok:#3ccf7a;--dg:#ff5560;--bd:#2c2c38;--log:#08080b;--logt:#9ff0b6}}
:root[data-theme="dark"]{--bg:#101014;--card:#1b1b22;--tx:#f1f1f5;--mu:#9a9aa8;--ac:#8d77f0;--acx:#12121a;--ok:#3ccf7a;--dg:#ff5560;--bd:#2c2c38;--log:#08080b;--logt:#9ff0b6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;padding:14px;max-width:900px;margin-inline:auto}
h1{font-size:20px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.lbl{font-size:13px;color:var(--mu);margin-bottom:8px}
button{font:inherit;font-size:17px;font-weight:600;border:0;border-radius:12px;padding:14px 18px;min-height:52px;background:var(--ac);color:var(--acx);cursor:pointer;flex:1}
button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button.pre{flex:0 0 auto;min-width:64px;padding:10px 14px;min-height:44px;font-size:15px}
button:disabled{opacity:.4}
button:active{transform:scale(.98)}
#estop{background:var(--dg);color:#fff;font-size:24px;min-height:78px;width:100%;letter-spacing:.04em}
input[type=number]{font:inherit;font-size:22px;width:130px;padding:10px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
#st{font-size:15px;color:var(--mu)}
#st.on{color:var(--ok);font-weight:700}
.big{font-size:44px;font-weight:700;line-height:1}
.unit{font-size:16px;color:var(--mu);margin-left:6px}
.pill{display:inline-block;padding:4px 10px;border-radius:99px;font-size:13px;font-weight:700;border:1px solid var(--bd)}
.pill.run{color:var(--ok);border-color:var(--ok)}
#log{background:var(--log);color:var(--logt);font-family:ui-monospace,Menlo,monospace;font-size:13px;border-radius:12px;padding:10px;height:170px;overflow-y:auto;white-space:pre-wrap;word-break:break-all}
#log .tx{color:#8ab4ff}#log .er{color:#ff8a8a}
.warn{font-size:13px;color:var(--mu);margin-top:8px}
</style>
</head>
<body>
<h1>펌프·앰부백 제어</h1>

<div class="card">
  <div class="row"><button id="conn">블루투스 연결</button></div>
  <div id="st" style="margin-top:10px">연결 안 됨</div>
</div>

<div class="card">
  <div class="lbl">현재 유량 (센서)</div>
  <div class="row" style="justify-content:space-between">
    <div><span class="big" id="flow">--</span><span class="unit">L/min</span></div>
    <div class="lbl" style="margin:0">목표 <b id="tgt">--</b></div>
  </div>
  <div class="row" style="margin-top:12px">
    <button class="sec" id="tel" disabled>유량 표시 켜기/끄기</button>
  </div>
</div>

<div class="card">
  <div class="lbl">펌프 목표 유량 (L/min)</div>
  <div class="row">
    <input type="number" id="fv" value="1.0" min="0.1" max="3" step="0.1" inputmode="decimal">
    <button id="setf" disabled>설정·시작</button>
    <button class="sec" id="pstop" disabled>펌프 정지</button>
  </div>
  <div class="row" style="margin-top:10px">
    <button class="sec pre" data-f="0.5" disabled>0.5</button>
    <button class="sec pre" data-f="1.0" disabled>1.0</button>
    <button class="sec pre" data-f="1.5" disabled>1.5</button>
    <button class="sec pre" data-f="2.0" disabled>2.0</button>
    <button class="sec pre" data-f="2.5" disabled>2.5</button>
  </div>
  <div class="row" style="margin-top:10px">
    <button class="sec" id="align" disabled>위상 정렬 (f)</button>
    <button class="sec" id="reset" disabled>누적량 리셋 (r)</button>
  </div>
  <div class="warn">위상 정렬은 약 0.4초 동안 다른 제어가 멈춥니다. 펌프 구동 전에 한 번만 하세요.</div>
</div>

<div class="card">
  <div class="row" style="justify-content:space-between;margin-bottom:10px">
    <div class="lbl" style="margin:0">앰부백 (12 BPM · 35 mm)</div>
    <span class="pill" id="vs">정지</span>
  </div>
  <button id="vent" disabled>앰부백 시작</button>
  <div class="warn">시작은 두 번 눌러야 합니다. 정지하면 원점 복귀에 약 2초 걸리며 그동안 다른 제어가 멈춥니다.</div>
</div>

<div class="card">
  <button id="estop" disabled>비상 정지</button>
  <div class="warn">앰부백은 원점으로 돌아가지 않고 즉시 멈춥니다. 물리 전원 스위치는 따로 두세요.</div>
</div>

<div class="card">
  <div class="lbl">통신 로그</div>
  <div id="log"></div>
</div>

<script>
const $=id=>document.getElementById(id);
const enc=new TextEncoder(),dec=new TextDecoder();
let dev=null,chW=null,chN=null,buf='',vent=false,armT=null;
const ctl=['tel','setf','pstop','align','reset','vent','estop'];

function log(s,c){
  const d=$('log'),e=document.createElement('div');
  if(c)e.className=c;
  e.textContent=s;d.appendChild(e);
  while(d.childNodes.length>60)d.removeChild(d.firstChild);
  d.scrollTop=d.scrollHeight;
}
function setSt(t,on){const e=$('st');e.textContent=t;e.className=on?'on':''}
function enable(on){
  ctl.forEach(i=>$(i).disabled=!on);
  document.querySelectorAll('button.pre').forEach(b=>b.disabled=!on);
}
function ventUI(){
  $('vs').textContent=vent?'구동 중':'정지';
  $('vs').className='pill'+(vent?' run':'');
  $('vent').textContent=vent?'앰부백 정지 (원점 복귀)':'앰부백 시작';
}

async function send(cmd){
  if(!chW){log('연결되어 있지 않습니다','er');return false}
  const d=enc.encode(cmd+'\n');
  try{
    for(let i=0;i<d.length;i+=20){
      const p=d.slice(i,i+20);
      if(chW.properties.writeWithoutResponse)await chW.writeValueWithoutResponse(p);
      else await chW.writeValue(p);
    }
    log('→ '+cmd,'tx');return true;
  }catch(e){log('전송 실패: '+e.message,'er');return false}
}

function onLine(line){
  const m=line.match(/^F:([\d.]+)/);
  if(m){$('flow').textContent=parseFloat(m[1]).toFixed(2);return}
  const t=line.match(/Target Set:\s*([\d.]+)/);
  if(t)$('tgt').textContent=parseFloat(t[1]).toFixed(2);
  if(/Pump System STOPPED/.test(line))$('tgt').textContent='0.00';
  if(/Ventilator STARTED/.test(line)){vent=true;ventUI()}
  if(/Ventilator STOPPED|EMERGENCY/.test(line)){vent=false;ventUI()}
  if(/EMERGENCY/.test(line))$('tgt').textContent='0.00';
  log(line);
}
function onData(ev){
  buf+=dec.decode(ev.target.value);
  let i;
  while((i=buf.indexOf('\n'))>=0){
    const l=buf.slice(0,i).trim();buf=buf.slice(i+1);
    if(l)onLine(l);
  }
  if(buf.length>200)buf='';
}
function onDis(){
  chW=chN=null;enable(false);vent=false;ventUI();
  setSt('연결이 끊겼습니다',false);$('conn').textContent='다시 연결';
  log('연결 끊김','er');
}

async function connect(){
  if(!navigator.bluetooth){
    setSt('이 브라우저는 Web Bluetooth를 지원하지 않습니다. Bluefy 앱에서 이 페이지를 여세요.',false);return;
  }
  try{
    setSt('기기 선택 중…',false);
    dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:[0xFFE0]});
    dev.addEventListener('gattserverdisconnected',onDis);
    setSt('연결 중…',false);
    const srv=await dev.gatt.connect();
    const svc=await srv.getPrimaryService(0xFFE0);
    chN=await svc.getCharacteristic(0xFFE1);
    try{chW=await svc.getCharacteristic(0xFFE2)}catch(e){chW=chN}
    await chN.startNotifications();
    chN.addEventListener('characteristicvaluechanged',onData);
    enable(true);
    setSt('연결됨: '+(dev.name||'기기'),true);
    $('conn').textContent='연결 해제';
    log('연결 완료');
  }catch(e){
    setSt('연결 실패: '+e.message,false);log('연결 실패: '+e.message,'er');
  }
}

$('conn').onclick=()=>{
  if(dev&&dev.gatt.connected){dev.gatt.disconnect()}else connect();
};
$('tel').onclick=()=>send('t');
$('setf').onclick=()=>{
  const v=parseFloat($('fv').value);
  if(!(v>=0.1&&v<=3)){log('유량은 0.1~3.0 사이로 입력하세요','er');return}
  send(String(v));
};
$('pstop').onclick=()=>send('0');
$('align').onclick=()=>send('f');
$('reset').onclick=()=>send('r');
$('estop').onclick=()=>{send('x');vent=false;ventUI()};
document.querySelectorAll('button.pre').forEach(b=>b.onclick=()=>{$('fv').value=b.dataset.f;send(b.dataset.f)});
$('vent').onclick=()=>{
  const b=$('vent');
  if(vent){send('v');return}
  if(armT){clearTimeout(armT);armT=null;b.textContent='앰부백 시작';send('v');return}
  b.textContent='한 번 더 누르면 시작';
  armT=setTimeout(()=>{armT=null;b.textContent='앰부백 시작'},3000);
};
ventUI();
</script>
</body>
</html>
